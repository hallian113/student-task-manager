<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Student Task Manager v1.0.1</title>
<style>
  body { font-family: Arial, sans-serif; background: #eef2f7; margin: 0; padding: 20px; }
  .box { max-width: 420px; margin: 30px auto; background: #fff; padding: 24px; border-radius: 10px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  h2 { text-align: center; color: #1F3864; margin-top: 0; }
  input { width: 100%; padding: 10px; margin: 6px 0; box-sizing: border-box; border: 1px solid #bbb; border-radius: 6px; }
  button { padding: 10px 14px; border: 0; border-radius: 6px; background: #2F5496; color: #fff; cursor: pointer; touch-action: manipulation; }
  .full { width: 100%; margin-top: 6px; }
  .link { text-align: center; margin-top: 10px; color: #2F5496; cursor: pointer; font-size: 14px; }
  .msg { color: #c00; text-align: center; font-size: 14px; min-height: 18px; }
  .row { display: flex; gap: 8px; }
  .row input { flex: 1; }
  ul { list-style: none; padding: 0; }
  li { display: flex; align-items: center; justify-content: space-between; padding: 8px; border-bottom: 1px solid #ddd; }
  li.done span { text-decoration: line-through; color: #888; }
  .del { background: #c0392b; margin-left: 6px; }
  .ok { background: #27ae60; }
  .hidden { display: none; }
  .top { display: flex; justify-content: space-between; align-items: center; font-size: 14px; }
</style>
</head>
<body>

<!-- LOGIN / SIGNUP -->
<div class="box" id="authBox">
  <h2 id="authTitle">Login</h2>
  <input type="email" id="email" placeholder="Email">
  <input type="password" id="password" placeholder="Password">
  <div class="msg" id="msg"></div>
  <button class="full" id="authBtn" onclick="submitAuth()">Login</button>
  <div class="link" id="toggle" onclick="toggleMode()">New user? Sign up</div>
</div>

<!-- TASK MANAGER -->
<div class="box hidden" id="appBox">
  <div class="top"><span id="who"></span><button onclick="logout()">Logout</button></div>
  <h2>My Tasks</h2>
  <div class="row">
    <input type="text" id="taskInput" placeholder="Enter a task">
    <button onclick="addTask()">Add</button>
  </div>
  <div class="msg" id="taskMsg"></div>
  <ul id="list"></ul>
</div>

<script>
  let mode = "login";
  let current = null;

  const getUsers = () => JSON.parse(localStorage.getItem("users") || "{}");
  const getTasks = () => JSON.parse(localStorage.getItem("tasks_" + current) || "[]");
  const saveTasks = t => localStorage.setItem("tasks_" + current, JSON.stringify(t));

  function toggleMode() {
    mode = mode === "login" ? "signup" : "login";
    document.getElementById("authTitle").textContent = mode === "login" ? "Login" : "Sign Up";
    document.getElementById("authBtn").textContent = mode === "login" ? "Login" : "Sign Up";
    document.getElementById("toggle").textContent = mode === "login" ? "New user? Sign up" : "Already have an account? Login";
    document.getElementById("msg").textContent = "";
  }

  function submitAuth() {
    const email = document.getElementById("email").value.trim();
    const pass = document.getElementById("password").value;
    const msg = document.getElementById("msg");
    if (!email || !pass) { msg.textContent = "Email and password are required"; return; }
    const users = getUsers();
    if (mode === "signup") {
      if (users[email]) { msg.textContent = "User already exists"; return; }
      users[email] = pass;
      localStorage.setItem("users", JSON.stringify(users));
      msg.style.color = "green"; msg.textContent = "Account created. Please login.";
      toggleMode(); msg.textContent = "Account created. Please login."; 
    } else {
      if (users[email] !== pass) { msg.style.color = "#c00"; msg.textContent = "Invalid credentials"; return; }
      current = email;
      document.getElementById("authBox").classList.add("hidden");
      document.getElementById("appBox").classList.remove("hidden");
      document.getElementById("who").textContent = email;
      render();
    }
  }

  function logout() {
    current = null;
    document.getElementById("appBox").classList.add("hidden");
    document.getElementById("authBox").classList.remove("hidden");
    document.getElementById("password").value = "";
  }

  function addTask() {
    const input = document.getElementById("taskInput");
    const title = input.value.trim();
    if (!title) { document.getElementById("taskMsg").textContent = "Task title cannot be empty"; return; }
    document.getElementById("taskMsg").textContent = "";
    const t = getTasks();
    t.push({ id: Date.now(), title: title, done: false });
    saveTasks(t);
    input.value = "";
    render();
  }

  function toggleDone(id) {
    const t = getTasks().map(x => x.id === id ? { ...x, done: !x.done } : x);
    saveTasks(t); render();
  }

  function deleteTask(id) {
    saveTasks(getTasks().filter(x => x.id !== id)); render();
  }

  function render() {
    const list = document.getElementById("list");
    list.innerHTML = "";
    getTasks().forEach(x => {
      const li = document.createElement("li");
      if (x.done) li.className = "done";
      const span = document.createElement("span");
      span.textContent = x.title;
      const box = document.createElement("div");
      const ok = document.createElement("button");
      ok.className = "ok"; ok.textContent = x.done ? "Undo" : "Done";
      ok.onclick = () => toggleDone(x.id);
      const del = document.createElement("button");
      del.className = "del"; del.textContent = "Delete";
      del.onclick = () => deleteTask(x.id);
      box.appendChild(ok); box.appendChild(del);
      li.appendChild(span); li.appendChild(box);
      list.appendChild(li);
    });
  }
</script>
</body>
</html>
